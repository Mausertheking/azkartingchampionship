<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    color:#e8c84a;

  .btn-primary { display:inline-block; background:#e8c84a; color:#0a0a0a; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:14px; letter-spacing:2px; text-transform:uppercase; padding:13px 34px; border:none; cursor:pointer; transition:background .2s, transform .15s; }
  .btn-primary:hover { background:#f5d96a; transform:translateY(-1px); }
  .btn-outline { display:inline-block; background:transparent; color:#f0ede8; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:14px; letter-spacing:2px; text-transform:uppercase; padding:13px 34px; border:1px solid rgba(240,237,232,.35); cursor:pointer; margin-left:12px; transition:border-color .2s, color .2s, transform .15s; }
  .btn-outline:hover { border-color:#e8c84a; color:#e8c84a; transform:translateY(-1px); }

  /* HERO ENTRANCE ANIMATION */
  .hero-eyebrow, .hero-title, .hero-sub, .hero-content .btn-primary, .hero-content .btn-outline {
    opacity:0; transform:translateY(28px) scale(.98);
    animation: heroIn .9s cubic-bezier(.22,1,.36,1) forwards;
  }
  .hero-eyebrow { animation-delay:.05s; }
  .hero-title   { animation-delay:.2s; }
  .hero-sub     { animation-delay:.4s; }
  .hero-content .btn-primary  { animation-delay:.55s; }

  /* STATS BAR */
  #stats-bar { background:#e8c84a; padding:20px 2rem; display:flex; justify-content:center; gap:4rem; flex-wrap:wrap; }

  .stat.in-view { opacity:1; transform:translateY(0); }

  /* SHARED SECTION */
  .section-wrap { padding:80px 2rem; max-width:1100px; margin:0 auto; }

  .eyebrow { font-family:'Barlow Condensed',sans-serif; font-size:12px; font-weight:600; letter-spacing:4px; text-transform:uppercase; color:#e8c84a; margin-bottom:.4rem; }
  .sec-title { font-family:'Barlow Condensed',sans-serif; font-weight:900; font-size:clamp(36px,5vw,58px); text-transform:uppercase; line-height:1; color:#f0ede8; margin-bottom:2rem; position:relative; clip-path:inset(0 100% -25% 0); transition:clip-path 1s cubic-bezier(.22,1,.36,1); }
  .sec-title.title-in { clip-path:inset(0 0% -25% 0); }
  .sec-title::after {
    content:''; position:absolute; left:0; bottom:-12px; height:3px; width:0;
    background:linear-gradient(90deg,#e8c84a,rgba(232,200,74,0));
    transition:width .9s cubic-bezier(.22,1,.36,1) .35s;
  }
  .sec-title.title-in::after { width:130px; }

  /* GENERIC SCROLL REVEAL */
  .reveal { opacity:0; transform:translateY(32px); transition:opacity .8s ease, transform .8s cubic-bezier(.22,1,.36,1); }
  .reveal.in-view { opacity:1; transform:translateY(0); }
  .reveal-left  { opacity:0; transform:translateX(-36px); transition:opacity .8s ease, transform .8s cubic-bezier(.22,1,.36,1); }
  .reveal-left.in-view  { opacity:1; transform:translateX(0); }
  .reveal-right { opacity:0; transform:translateX(36px); transition:opacity .8s ease, transform .8s cubic-bezier(.22,1,.36,1); }
  .reveal-right.in-view { opacity:1; transform:translateX(0); }

  /* ABOUT */
  .about-grid { display:grid; grid-template-columns:1fr 1fr; gap:4rem; align-items:center; }
  .about-text p { font-size:15px; line-height:1.8; color:rgba(240,237,232,.72); margin-bottom:1rem; }
  .about-img-wrap { position:relative; }

  .about-badge { position:absolute; bottom:-16px; right:-16px; background:#e8c84a; padding:16px 20px; text-align:center; }

  .about-badge-sub { font-size:10px; font-weight:600; letter-spacing:2px; text-transform:uppercase; color:rgba(10,10,10,.55); }

  /* SCHEDULE */
  .schedule-item {
    display:grid; grid-template-columns:100px 1fr auto; align-items:center; gap:2rem; padding:1.5rem 0;
    border-bottom:1px solid rgba(255,255,255,.07);
    opacity:0; transform:translateX(-24px);
    transition:background .15s, padding-left .15s, opacity .7s ease, transform .7s cubic-bezier(.22,1,.36,1);
  }
  .schedule-item.in-view { opacity:1; transform:translateX(0); }
  .schedule-item:first-child { border-top:1px solid rgba(255,255,255,.07); }
  .schedule-item:hover { background:rgba(232,200,74,.05); padding-left:.5rem; }
  .sched-date { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:14px; letter-spacing:1px; text-transform:uppercase; color:#e8c84a; }
  .sched-name { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:22px; text-transform:uppercase; color:#f0ede8; }
  .sched-loc { font-size:13px; color:rgba(240,237,232,.45); margin-top:3px; }
  .badge { font-family:'Barlow Condensed',sans-serif; font-size:11px; font-weight:600; letter-spacing:2px; text-transform:uppercase; padding:5px 12px; white-space:nowrap; }
  .badge-open { background:rgba(232,200,74,.12); color:#e8c84a; border:1px solid rgba(232,200,74,.3); }
  .badge-upcoming { background:rgba(255,255,255,.05); color:rgba(240,237,232,.4); border:1px solid rgba(255,255,255,.1); }

  /* GALLERY */
  #gallery { position:relative; overflow:hidden; }
  .gallery-speedlines {
    position:absolute; inset:0; pointer-events:none; z-index:0; opacity:.05;
    background:repeating-linear-gradient(100deg, transparent 0 40px, #e8c84a 40px 42px, transparent 42px 90px);
    animation: speedLineMove 7s linear infinite;
  }
  @keyframes speedLineMove { from { background-position-x:0; } to { background-position-x:-450px; } }
  .gallery-kart-zoom {
    position:absolute; top:18px; left:-160px; width:110px; height:46px; z-index:1; opacity:0; pointer-events:none;
  }
  .gallery-kart-zoom.run { animation: kartZoom 1.7s cubic-bezier(.3,.6,.2,1) forwards; }
  @keyframes kartZoom {
    0%   { left:-160px; opacity:0; transform:scale(.9) rotate(0deg); }
    8%   { opacity:1; }
    50%  { transform:scale(1.05) rotate(-1deg); }
    92%  { opacity:1; }
    100% { left:104%; opacity:0; transform:scale(.95) rotate(1deg); }
  }
  .gallery-flag {
    display:inline-block; width:26px; height:18px; margin-left:12px; vertical-align:middle;

  }
  @keyframes flagWave { 0%,100% { transform: skewY(0deg); } 50% { transform: skewY(5deg); } }

  /* 3D spin wheel */
  .spin-wheel { width:40px; height:40px; position:relative; perspective:300px; display:inline-block; vertical-align:middle; margin-left:14px; }
  .spin-wheel-inner {
    width:100%; height:100%; border-radius:50%;
    background: radial-gradient(circle at 50% 50%, #333 0 28%, #1a1a1a 28% 36%, #555 36% 41%, #1a1a1a 41% 100%);
    border:3px solid #e8c84a; transform-style:preserve-3d;
    animation: wheelSpin3d 2.4s linear infinite;
  }
  @keyframes wheelSpin3d {
    0%   { transform: rotateY(0deg) rotateX(10deg); }
    100% { transform: rotateY(360deg) rotateX(10deg); }
  }
  .spin-wheel-inner::before, .spin-wheel-inner::after {
    content:''; position:absolute; background:#e8c84a; border-radius:2px;
  }
  .spin-wheel-inner::before { width:100%; height:3px; top:50%; left:0; transform:translateY(-50%); }
  .spin-wheel-inner::after { width:3px; height:100%; left:50%; top:0; transform:translateX(-50%); }

  /* 3D drift kart loop */
  .drift-kart {
    position:absolute; bottom:10px; right:24px; width:84px; height:55px; z-index:1;
    pointer-events:none; opacity:.65; transform-style:preserve-3d;
    animation: driftLoop 7s ease-in-out infinite;
  }
  @keyframes driftLoop {
    0%   { transform: perspective(500px) translateX(0)    rotate(0deg)  rotateY(0deg)   scale(1); }

    60%  { transform: perspective(500px) translateX(-18px) rotate(-4deg) rotateY(10deg) scale(1.03); }
    80%  { transform: perspective(500px) translateX(8px)   rotate(3deg)  rotateY(-8deg)  scale(.97); }

  }

  /* 3D coverflow carousel */
  .gallery-carousel {

    display:flex; align-items:center; justify-content:center;
    background:rgba(10,10,10,.55); border:1px solid rgba(232,200,74,.4); color:#e8c84a;
    font-size:16px; opacity:0; transform:scale(.7); transition:opacity .25s, transform .25s;
  }
  .photo-cell:hover .photo-cell-expand { opacity:1; transform:scale(1); }

  /* LIGHTBOX */
  .lightbox {
    position:fixed; inset:0; background:rgba(6,6,6,.92); z-index:1000;
    display:flex; align-items:center; justify-content:center; opacity:0; visibility:hidden;
    transition:opacity .25s ease; padding:2rem;
  }
  .lightbox.open { opacity:1; visibility:visible; }
  .lightbox-img-wrap { max-width:1100px; max-height:80vh; width:100%; text-align:center; perspective:1200px; }
  .lightbox-img-wrap img { max-width:100%; max-height:80vh; object-fit:contain; backface-visibility:hidden; transition:opacity .25s; }
  .lightbox-img-wrap.flip-next img { animation: flipNext .5s ease; }
  .lightbox-img-wrap.flip-prev img { animation: flipPrev .5s ease; }
  @keyframes flipNext { 0% { transform:rotateY(0deg); } 50% { transform:rotateY(90deg); opacity:0; } 51% { opacity:1; } 100% { transform:rotateY(0deg); } }
  @keyframes flipPrev { 0% { transform:rotateY(0deg); } 50% { transform:rotateY(-90deg); opacity:0; } 51% { opacity:1; } 100% { transform:rotateY(0deg); } }
  .lightbox-caption { margin-top:1rem; font-family:'Barlow Condensed',sans-serif; font-size:14px; letter-spacing:2px; text-transform:uppercase; color:#e8c84a; }

  /* GALLERY ACCESSIBILITY: focus states */
  .photo-cell:focus-visible,
  .carousel-slide:focus-visible,
  .carousel-dot:focus-visible,
  .lightbox-close:focus-visible,
  .lightbox-prev:focus-visible,
  .lightbox-next:focus-visible {
    outline: 2px solid #e8c84a; outline-offset: 3px;
  }

  /* GALLERY: respect reduced-motion preference */
  @media (prefers-reduced-motion: reduce) {
    .gallery-flag,
    .spin-wheel-inner,
    .drift-kart,
    .gallery-speedlines,
    .gallery-kart-zoom.run {
      animation: none !important;
    }
    .gallery-kart-zoom { display: none; }
    .hero-eyebrow, .hero-title, .hero-sub, .hero-content .btn-primary, .hero-content .btn-outline,
    .reveal, .reveal-left, .reveal-right, .stat, .schedule-item, .driver-card {
      opacity:1 !important; transform:none !important; animation:none !important; transition:none !important;
    }
    .driver-card:hover { transform:none !important; }
    .driver-card:hover .driver-num { transform:none !important; }
    .photo-cell {
      opacity: 1; transform: none; transition: none;
    }
    .photo-cell:hover { transform: none !important; }
    .carousel-slide { transition: opacity .3s ease !important; }
    .carousel-slide.prev, .carousel-slide.next, .carousel-slide.hidden-slide { transform: none !important; }
    .lightbox-img-wrap.flip-next img,
    .lightbox-img-wrap.flip-prev img {
      animation: none !important;
    }
    .hero-title .gold { animation: none !important; }
    .sec-title { clip-path: none !important; transition: none !important; }
    .sec-title::after { transition: none !important; }
  }
  .lightbox-close, .lightbox-prev, .lightbox-next {
    position:absolute; background:transparent; border:1px solid rgba(240,237,232,.25); color:#f0ede8;
    width:44px; height:44px; display:flex; align-items:center; justify-content:center; cursor:pointer;
    font-size:20px; transition:border-color .2s, color .2s;
  }
  .lightbox-close:hover, .lightbox-prev:hover, .lightbox-next:hover { border-color:#e8c84a; color:#e8c84a; }
  .lightbox-close { top:1.5rem; right:1.5rem; }
  .lightbox-prev { left:1.5rem; top:50%; transform:translateY(-50%); }
  .lightbox-next { right:1.5rem; top:50%; transform:translateY(-50%); }

  /* DRIVERS */
  .drivers-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; perspective:1000px; }
  .driver-card {
    background:#141414; border:1px solid rgba(255,255,255,.06); padding:1.5rem;
    opacity:0; transform:translateY(40px) rotateX(-8deg); transform-style:preserve-3d;
    transition:opacity .7s ease, transform .35s cubic-bezier(.22,1,.36,1), border-color .3s, box-shadow .3s;
    will-change:transform;
  }
  .driver-card.in-view { opacity:1; transform:translateY(0) rotateX(0deg); }
  .driver-card:hover { border-color:rgba(232,200,74,.35); box-shadow:0 24px 48px rgba(0,0,0,.45); }
  .driver-num { font-family:'Barlow Condensed',sans-serif; font-weight:900; font-size:48px; color:#e8c84a; line-height:1; margin-bottom:.5rem; transition:transform .35s ease; }
  .driver-card:hover .driver-num { transform:translateZ(20px) scale(1.08); }
  .driver-name { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:22px; text-transform:uppercase; color:#f0ede8; }
  .driver-cat { font-size:12px; font-weight:600; letter-spacing:2px; text-transform:uppercase; color:rgba(240,237,232,.38); margin-top:4px; }
  .driver-stats { display:flex; gap:1.5rem; margin-top:1rem; padding-top:1rem; border-top:1px solid rgba(255,255,255,.06); }
  .ds-val { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:20px; color:#f0ede8; }
  .ds-lbl { font-size:11px; color:rgba(240,237,232,.4); text-transform:uppercase; letter-spacing:1px; }

  /* ORGANIZERS / TEAM — paddock credentials */
  #organizers { position:relative; overflow:hidden; }
  .org-ambient {
    position:absolute; inset:0; pointer-events:none; z-index:0;
    background:radial-gradient(620px 320px at 50% -8%, rgba(232,200,74,.10), transparent 70%);
  }
  .org-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:18px; perspective:1200px; position:relative; z-index:1; }
  .org-card {
    position:relative; overflow:hidden;
    background:linear-gradient(180deg,#171717 0%,#0d0d0d 100%);
    border:1px solid rgba(255,255,255,.07); border-radius:16px;
    padding:1.4rem 1.2rem 1.2rem;
    display:flex; flex-direction:column; align-items:center; text-align:center;
    opacity:0; transform:translateY(40px); transform-style:preserve-3d;
    transition:opacity .7s ease, transform .4s cubic-bezier(.22,1,.36,1), border-color .3s, box-shadow .3s;
    will-change:transform;
  }
  .org-card.in-view { opacity:1; transform:translateY(0); }
  .org-card::before {
    content:''; position:absolute; top:0; left:0; right:0; height:3px; z-index:2;
    background:linear-gradient(90deg, transparent, #e8c84a 20%, #fff6d0 50%, #e8c84a 80%, transparent);
    opacity:.75;
  }
  .org-card:hover { border-color:rgba(232,200,74,.4); box-shadow:0 28px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(232,200,74,.12); }

  .org-cred { display:flex; align-items:center; justify-content:space-between; width:100%; margin-bottom:1rem; }
  .org-cred-label { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:rgba(240,237,232,.42); }
  .org-cred-checker { width:34px; height:11px; background-image:repeating-conic-gradient(#f0ede8 0% 25%, #0a0a0a 0% 50%); background-size:5.5px 5.5px; border-radius:2px; opacity:.65; }

  .org-avatar-wrap { position:relative; width:106px; height:106px; display:grid; place-items:center; margin-bottom:1.05rem; }
  .org-avatar-wrap::before {
    content:''; position:absolute; inset:0; border-radius:50%;
    background:conic-gradient(from 0deg, #e8c84a, #fff6d0, #b8941f, #e8c84a);
    animation:orgRing 5s linear infinite;
  }
  @keyframes orgRing { to { transform:rotate(360deg); } }
  .org-avatar {
    position:relative; z-index:1; width:92px; height:92px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Barlow Condensed',sans-serif; font-weight:900; font-size:33px; letter-spacing:1px;
    color:#e8c84a; background:radial-gradient(circle at 50% 38%, #1d1d1d, #0b0b0b);
    border:1px solid rgba(232,200,74,.25); box-shadow:inset 0 2px 12px rgba(0,0,0,.65);
    transition:transform .35s ease;
  }
  .org-card:hover .org-avatar { transform:scale(1.05); }
  .org-avatar-icon {
    position:absolute; z-index:2; bottom:-1px; right:-1px;
    width:34px; height:34px; border-radius:50%; background:#e8c84a; color:#0a0a0a;
    display:flex; align-items:center; justify-content:center; font-size:17px;
    border:3px solid #0e0e0e; box-shadow:0 4px 10px rgba(0,0,0,.45);
  }
  .org-name { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:21px; text-transform:uppercase; color:#f0ede8; line-height:1.05; }
  .org-role {
    font-size:10.5px; font-weight:600; letter-spacing:1.2px; text-transform:uppercase;
    margin-top:8px; line-height:1.55; min-height:30px;
    color:#e8c84a; /* fallback */
    background:linear-gradient(100deg, #e8c84a 0%, #fff6d0 22%, #e8c84a 45%, #b8941f 65%, #e8c84a 100%);
    background-size:220% auto;
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    animation: goldShine 4.5s linear infinite;
  }

  .org-foot { margin-top:auto; padding-top:1rem; width:100%; }
  .org-telemetry { display:flex; align-items:flex-end; justify-content:center; gap:3px; height:26px; width:100%; }
  .org-telemetry span {
    width:4px; min-height:3px; border-radius:2px;
    background:linear-gradient(to top, #b8941f, #e8c84a 55%, #fff6d0);
    animation:orgEq 1.1s ease-in-out infinite;
  }
  @keyframes orgEq { 0%,100% { height:18%; } 50% { height:100%; } }
  .org-live { display:flex; align-items:center; justify-content:center; gap:6px; margin-top:8px; }
  .org-live-dot {
    width:7px; height:7px; border-radius:50%; background:#33d65a;
    box-shadow:0 0 8px rgba(51,214,90,.9); animation:orgPulse 1.4s ease-in-out infinite;
  }
  @keyframes orgPulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.35; transform:scale(.65); } }
  .org-live span { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:9px; letter-spacing:2px; text-transform:uppercase; color:rgba(240,237,232,.45); }

  .org-shine {
    position:absolute; top:0; left:-60%; width:50%; height:100%; pointer-events:none; z-index:3;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,.08) 50%, transparent);
    transform:skewX(-18deg);
  }
  .org-card:hover .org-shine { animation:orgShine .9s ease; }
  @keyframes orgShine { from { left:-60%; } to { left:130%; } }

  @media (prefers-reduced-motion: reduce) {
    .org-avatar-wrap::before, .org-card:hover .org-shine, .org-role,
    .org-telemetry span, .org-live-dot { animation:none !important; }
    .org-telemetry span { height:40%; }
  }

  /* CONTACT */
  .contact-grid { display:grid; grid-template-columns:1fr 1fr; gap:4rem; }
  .contact-info p { font-size:15px; line-height:1.8; color:rgba(240,237,232,.7); margin-bottom:1.5rem; }
  .contact-detail { display:flex; align-items:flex-start; gap:12px; margin-bottom:1rem; }
  .contact-detail i { font-size:18px; color:#e8c84a; margin-top:2px; }
  .contact-detail-text { font-size:14px; color:rgba(240,237,232,.7); line-height:1.65; }
  .contact-form { display:flex; flex-direction:column; gap:12px; }
  .contact-form input,
  .contact-form textarea,
  .contact-form select {
    background:#141414; border:1px solid rgba(255,255,255,.1); color:#f0ede8;
    font-family:'Barlow',sans-serif; font-size:14px; padding:12px 16px; width:100%;
    transition:border-color .2s; appearance:none; -webkit-appearance:none;
  }
  .contact-form input:focus,
  .contact-form textarea:focus,
  .contact-form select:focus { outline:none; border-color:#e8c84a; }
  .contact-form input::placeholder,
  .contact-form textarea::placeholder { color:rgba(240,237,232,.3); }
  .contact-form textarea { min-height:120px; resize:vertical; }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .form-success { font-size:13px; color:#e8c84a; text-align:center; margin-top:4px; display:none; }

  /* FOOTER */
  footer { background:#060606; border-top:1px solid rgba(255,255,255,.06); padding:36px 2rem; }
  .footer-inner { max-width:1100px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1rem; }
  .footer-logo { font-family:'Barlow Condensed',sans-serif; font-weight:900; font-size:17px; letter-spacing:2px; color:#e8c84a; text-transform:uppercase; }
  .footer-copy { font-size:12px; color:rgba(240,237,232,.28); }
  .footer-links { display:flex; gap:1.5rem; }
  .footer-links a { font-size:12px; color:rgba(240,237,232,.38); text-decoration:none; text-transform:uppercase; letter-spacing:1px; transition:color .2s; }
  .footer-links a:hover { color:#e8c84a; }


  #kart-track {
    position: fixed; bottom: 0; left: 0; width: 100%; height: 68px;
    pointer-events: none; z-index: 999; overflow: hidden;
    opacity: 0; transition: opacity 0.5s ease;
    perspective: 700px; perspective-origin: 50% 80%;
  }
  #kart-track.visible { opacity: 1; }
  #kart-road {
    position: absolute; bottom: 0; left: 0; width: 100%; height: 22px;
    background: #181818; border-top: 2px solid #2a2a2a;
  }
  #kart-dashes {
    position: absolute; bottom: 9px; left: 0; width: 200%; height: 4px;
    background: repeating-linear-gradient(90deg,#e8c84a 0,#e8c84a 36px,transparent 36px,transparent 72px);
    animation: moveDashes 0.35s linear infinite;
  }
  @keyframes moveDashes { to { transform: translateX(-72px); } }
  #kart-svg { position: absolute; bottom: 6px; left: -140px; width: 91px; height: 60px; transform-style: preserve-3d; transform-origin: 50% 70%; will-change: left, transform; }
  #kart-streak {
    position: absolute; bottom: 36px; height: 4px; border-radius: 2px;
    background: linear-gradient(to left, rgba(232,200,74,0.75), transparent);
    width: 0px; left: 0;
  }
  .kart-puff { position: absolute; border-radius: 50%; pointer-events: none; }

  /* REACTION GAME — "LIGHTS OUT" */
  #reaction { position:relative; overflow:hidden; }
  .reaction-intro { font-size:16px; color:rgba(240,237,232,.65); max-width:560px; margin-bottom:2.25rem; line-height:1.7; }
  .reaction-intro strong { color:#e8c84a; }
  .rt-panel {
    background:linear-gradient(180deg,#121212 0%,#0c0c0c 100%);
    border:1px solid rgba(255,255,255,.08); border-radius:14px;
    padding:2.5rem 1.5rem 2rem; text-align:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.04), 0 24px 60px rgba(0,0,0,.5);
  }
  .rt-gantry {
    display:inline-flex; gap:clamp(10px,3vw,26px);
    background:#060606; padding:22px clamp(16px,4vw,34px);
    border-radius:12px; border:1px solid rgba(255,255,255,.06);
    box-shadow:inset 0 2px 12px rgba(0,0,0,.8);
  }
  .rt-light {
    width:clamp(34px,8vw,54px); height:clamp(34px,8vw,54px); border-radius:50%;
    background:radial-gradient(circle at 38% 34%, #3a0d0d, #160404 70%);
    border:2px solid #000; position:relative;
    transition:background .08s ease, box-shadow .08s ease;
  }
  .rt-light::after {
    content:''; position:absolute; top:18%; left:24%; width:34%; height:24%;
    border-radius:50%; background:rgba(255,255,255,.10);
  }
  .rt-light.on {
    background:radial-gradient(circle at 38% 34%, #ff6a5a, #d11a14 62%, #6e0a08 100%);
    box-shadow:0 0 18px 3px rgba(226,30,22,.75), inset 0 0 8px rgba(255,200,180,.4);
  }
  .rt-light.go {
    background:radial-gradient(circle at 38% 34%, #b6ffb0, #18c93f 60%, #066b1c 100%);
    box-shadow:0 0 22px 5px rgba(40,220,80,.8), inset 0 0 8px rgba(220,255,210,.5);
  }
  .rt-readout {
    font-family:'Barlow Condensed',sans-serif; font-weight:900; text-transform:uppercase;
    letter-spacing:1px; line-height:1; margin:1.75rem auto .35rem; min-height:54px;
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(30px,6vw,52px); color:#f0ede8;
  }
  .rt-readout .rt-unit { font-size:.42em; color:rgba(240,237,232,.5); margin-left:6px; letter-spacing:2px; }
  .rt-readout.go    { color:#33d65a; }
  .rt-readout.foul  { color:#ff5a4d; }
  .rt-readout.armed { color:#e8c84a; }
  .rt-rating { font-size:14px; letter-spacing:2px; text-transform:uppercase; font-weight:600; color:rgba(240,237,232,.7); min-height:20px; margin-bottom:1.5rem; }
  .rt-rating b { color:#e8c84a; }
  .rt-actions { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .rt-best { margin-top:1.5rem; font-size:12px; letter-spacing:2px; text-transform:uppercase; color:rgba(240,237,232,.4); }
  .rt-best b { color:#e8c84a; }
  .rt-record {
    margin-top:.55rem; font-family:'Barlow Condensed',sans-serif; font-weight:700;
    font-size:14px; letter-spacing:2px; text-transform:uppercase; color:rgba(240,237,232,.55);
  }
  .rt-record b { color:#e8c84a; }
  .rt-record .rt-crown { color:#e8c84a; margin-right:4px; }
  .rt-record-form { display:none; gap:8px; justify-content:center; align-items:center; margin-top:1.1rem; flex-wrap:wrap; }
  .rt-record-form.show { display:flex; }
  .rt-record-form input {
    background:#141414; border:1px solid rgba(232,200,74,.45); color:#f0ede8;
    font-family:'Barlow',sans-serif; font-size:14px; padding:10px 14px; width:230px; text-align:center;
  }
  .rt-record-form input:focus { outline:none; border-color:#e8c84a; }
  .rt-record-form input::placeholder { color:rgba(240,237,232,.32); }
  .rt-panel.clickable { cursor:pointer; }
  .rt-panel.clickable:active { transform:scale(.997); }
  .rt-shake { animation:rtShake .4s ease; }
  @keyframes rtShake { 0%,100%{transform:translateX(0);} 20%{transform:translateX(-7px);} 40%{transform:translateX(7px);} 60%{transform:translateX(-5px);} 80%{transform:translateX(5px);} }

  /* RESPONSIVE */
  @media (max-width:720px) {
    .about-grid, .contact-grid, .drivers-grid { grid-template-columns:1fr; }
    .org-grid { grid-template-columns:1fr 1fr; }
    .photo-grid { grid-template-columns:1fr 1fr; }
    .photo-cell:first-child { grid-column:span 2; grid-row:span 1; }
    .schedule-item { grid-template-columns:80px 1fr; }
    .schedule-item .badge { display:none; }
    .nav-links { display:none; }
    #stats-bar { gap:2rem; }
    .form-row { grid-template-columns:1fr; }
    .about-badge { right:0; bottom:-12px; }
    .lightbox-prev, .lightbox-next { width:36px; height:36px; font-size:16px; }
    .lightbox-prev { left:.5rem; }
    .lightbox-next { right:.5rem; }
    .lightbox-close { top:.75rem; right:.75rem; }
    .gallery-carousel { height:180px; }
    .carousel-slide { width:82%; }
    .carousel-slide.prev, .carousel-slide.next { opacity:0; }
    .drift-kart { width:56px; height:37px; bottom:6px; right:10px; }
  }
</style>

<body>

<!-- All HTML is built by JavaScript from CONFIG above -->
<div id="root"></div>

<script>
(function () {
  const C = CONFIG;
  document.title = C.pageTitle;

  /* ---- helpers ---- */
  const el = (tag, attrs, ...children) => {
    const e = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => {
      if (k === 'class') e.className = v;
      else if (k === 'html') e.innerHTML = v;
      else e.setAttribute(k, v);
    });
    children.forEach(c => { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  };
  const div  = (cls, ...c) => el('div', { class: cls }, ...c);
  const span = (cls, txt) => el('span', { class: cls }, txt);
  const section = (id, ...c) => el('section', { id }, ...c);

  /* ---- NAV ---- */
  const navEl = el('nav', { id: 'site-nav' });
  const logo = span('nav-logo', C.nav.logo);
  const links = div('nav-links');
  C.nav.links.forEach(l => {
    const a = el('a', {});
    a.textContent = l.label;
    a.onclick = () => document.getElementById(l.target).scrollIntoView({ behavior: 'smooth' });
    links.appendChild(a);
  });
  navEl.append(logo, links);

  /* ---- HERO ---- */
  const heroSec = section('hero');
  const heroCanvas = el('canvas', { id: 'heroCanvas' });
  const overlay = div('hero-overlay');
  const heroContent = div('hero-content');
  heroContent.innerHTML = `
    <div class="hero-eyebrow">${C.hero.eyebrow}</div>
    <h1 class="hero-title">${C.hero.line1}<br><span class="gold">${C.hero.line2}</span><br>${C.hero.line3}</h1>
    <p class="hero-sub">${C.hero.subtitle}</p>
  `;
  const b1 = el('button', { class: 'btn-primary' }, C.hero.btn1.label);
  b1.onclick = () => document.getElementById(C.hero.btn1.target).scrollIntoView({ behavior: 'smooth' });
  const b2 = el('button', { class: 'btn-outline' }, C.hero.btn2.label);
  b2.onclick = () => document.getElementById(C.hero.btn2.target).scrollIntoView({ behavior: 'smooth' });
  heroContent.append(b1, b2);
  heroSec.append(heroCanvas, overlay, heroContent);

  /* ---- STATS BAR ---- */
  const statsBar = el('div', { id: 'stats-bar' });
  C.stats.forEach(s => {
    const box = div('stat');
    box.innerHTML = `<div class="stat-num">${s.value}</div><div class="stat-label">${s.label}</div>`;
    statsBar.appendChild(box);
  });

  /* ---- ABOUT ---- */
  const aboutSec = section('about');
  const aboutWrap = div('section-wrap');
  const aboutGrid = div('about-grid');
  const aboutText = div('about-text reveal-left');
  aboutText.innerHTML = `<div class="eyebrow">${C.about.eyebrow}</div><h2 class="sec-title">${C.about.title}</h2>`;
  C.about.body.forEach(p => { const pEl = el('p', {}); pEl.textContent = p; aboutText.appendChild(pEl); });
  const abBtn = el('button', { class: 'btn-primary', style: 'margin-top:1rem; font-size:13px; padding:12px 28px;' }, C.about.btnLabel);
  aboutText.appendChild(abBtn);

  const aboutImgWrap = div('about-img-wrap reveal-right');
  const aboutImgBox = div('about-img-box');
  const aboutImg = el('img', { src: C.about.photo, alt: C.about.photoAlt });
  aboutImgBox.appendChild(aboutImg);
  const badge = div('about-badge');
  badge.innerHTML = `<div class="about-badge-num">${C.about.foundedYear}</div><div class="about-badge-sub">Founded</div>`;
  aboutImgWrap.append(aboutImgBox, badge);
  aboutGrid.append(aboutText, aboutImgWrap);
  aboutWrap.appendChild(aboutGrid);
  aboutSec.appendChild(aboutWrap);

  /* ---- SCHEDULE ---- */
  const schedSec = section('schedule');
  const schedWrap = div('section-wrap');
  schedWrap.innerHTML = `<div class="eyebrow">${C.schedule.eyebrow}</div><h2 class="sec-title">${C.schedule.title}</h2><p style="font-size:16px;color:rgba(240,237,232,.65);margin-bottom:2rem;"><i class="ti ti-clock" aria-hidden="true" style="color:#e8c84a;margin-right:6px;"></i>Every <strong style="color:#e8c84a;">Tuesday at 8:00 PM</strong> — rental karts provided, no licence needed. <span style="display:inline-block;margin-top:6px;color:#e8c84a;font-weight:600;">⏱ Lap time requirement: under 45 seconds at Baku City Karting Arena.</span></p>`;
  C.schedule.races.forEach((r, i) => {
    const row = div('schedule-item');
    row.style.transitionDelay = (i * 80) + 'ms';
    row.innerHTML = `
      <div class="sched-date">${r.date}</div>
      <div>
        <div class="sched-name">${r.name}</div>
        <div class="sched-loc"><i class="ti ti-map-pin" aria-hidden="true"></i> ${r.location}</div>
      </div>
      <span class="badge ${r.status === 'rental' ? 'badge-open' : 'badge-upcoming'}">${r.status === 'rental' ? 'Rental' : 'Upcoming'}</span>
    `;
    schedWrap.appendChild(row);
  });
  schedSec.appendChild(schedWrap);

  /* ---- GALLERY ---- */
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const galSec = section('gallery');
  const galWrap = div('section-wrap');
  galWrap.innerHTML = `<div class="eyebrow">${C.gallery.eyebrow}</div><h2 class="sec-title">${C.gallery.title}<span class="gallery-flag" aria-hidden="true"></span><span class="spin-wheel" aria-hidden="true"><span class="spin-wheel-inner"></span></span></h2>`;

  /* 3D coverflow carousel */
  const carousel = div('gallery-carousel');
  const carouselSlides = C.gallery.photos.map((p, i) => {
    const s = el('div', { class: 'carousel-slide', role: 'button', tabindex: '0', 'aria-label': `View photo: ${p.alt}` });
    s.appendChild(el('img', { src: p.src, alt: '', loading: 'lazy' }));
    s.onclick = () => openLightbox(i);
    s.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLightbox(i); } });
    carousel.appendChild(s);
    return s;
  });
  const carouselDots = div('carousel-dots');
  const carouselDotEls = C.gallery.photos.map((p, i) => {
    const d = el('div', { class: 'carousel-dot', role: 'button', tabindex: '0', 'aria-label': `Show slide ${i + 1}: ${p.alt}` });
    d.appendChild(el('div', { class: 'carousel-dot-progress' }));
    const go = () => { carouselIndex = i; updateCarousel(); resetCarouselTimer(); };
    d.onclick = go;
    d.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
    carouselDots.appendChild(d);
    return d;
  });
  let carouselIndex = 0;
  let carouselTimer;
  function updateCarousel() {
    const n = carouselSlides.length;
    carouselSlides.forEach((s, i) => {
      const diff = (i - carouselIndex + n) % n;
      s.className = 'carousel-slide ' + (diff === 0 ? 'active' : diff === 1 ? 'next' : diff === n - 1 ? 'prev' : 'hidden-slide');
      s.setAttribute('aria-hidden', diff === 0 ? 'false' : 'true');
    });
    carouselDotEls.forEach((d, i) => d.classList.toggle('active', i === carouselIndex));
    animateActiveDot();
  }
  function animateActiveDot() {
    carouselDotEls.forEach(d => {
      const bar = d.querySelector('.carousel-dot-progress');
      bar.style.transition = 'none';
      bar.style.transform = 'scaleX(0)';
    });
    if (prefersReducedMotion) return;
    const activeBar = carouselDotEls[carouselIndex].querySelector('.carousel-dot-progress');
    requestAnimationFrame(() => {
      activeBar.style.transition = 'transform 4000ms linear';
      activeBar.style.transform = 'scaleX(1)';
    });
  }
  function resetCarouselTimer() {
    clearInterval(carouselTimer);
    if (prefersReducedMotion) return;
    carouselTimer = setInterval(() => { carouselIndex = (carouselIndex + 1) % carouselSlides.length; updateCarousel(); }, 4000);
  }
  updateCarousel();
  resetCarouselTimer();
  carousel.addEventListener('mouseenter', () => clearInterval(carouselTimer));
  carousel.addEventListener('mouseleave', resetCarouselTimer);
  carousel.addEventListener('focusin', () => clearInterval(carouselTimer));
  carousel.addEventListener('focusout', resetCarouselTimer);

  const photoGrid = div('photo-grid');
  C.gallery.photos.forEach((p, i) => {
    const cell = el('div', { class: 'photo-cell', role: 'button', tabindex: '0', 'aria-label': `View photo: ${p.alt}` });
    cell.dataset.index = i;
    const img = el('img', { src: p.src, alt: p.alt, loading: 'lazy' });
    const ov = div('photo-cell-overlay');
    const caption = div('photo-cell-caption', span('', p.alt));
    caption.setAttribute('aria-hidden', 'true');
    const expand = el('div', { class: 'photo-cell-expand', 'aria-hidden': 'true' });
    expand.innerHTML = '<i class="ti ti-zoom-in" aria-hidden="true"></i>';
    const glare = el('div', { class: 'photo-cell-glare', 'aria-hidden': 'true' });
    cell.append(img, ov, caption, expand, glare);
    cell.onclick = () => openLightbox(i);
    cell.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLightbox(i); } });
    if (!prefersReducedMotion) {
      cell.addEventListener('mousemove', e => {
        const r = cell.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width;
        const y = (e.clientY - r.top) / r.height;
        const rotX = (0.5 - y) * 12;
        const rotY = (x - 0.5) * 12;
        cell.style.transform = `perspective(800px) rotateX(${rotX}deg) rotateY(${rotY}deg) scale3d(1.03,1.03,1.03)`;
        glare.style.background = `radial-gradient(circle at ${x * 100}% ${y * 100}%, rgba(255,255,255,.35), transparent 60%)`;
      });
      cell.addEventListener('mouseleave', () => { cell.style.transform = ''; });
    }
    photoGrid.appendChild(cell);
  });

  /* ---- LIGHTBOX ---- */
  const lightbox = el('div', { class: 'lightbox' });
  lightbox.innerHTML = `
    <button class="lightbox-close" aria-label="Close"><i class="ti ti-x" aria-hidden="true"></i></button>
    <button class="lightbox-prev" aria-label="Previous"><i class="ti ti-chevron-left" aria-hidden="true"></i></button>
    <button class="lightbox-next" aria-label="Next"><i class="ti ti-chevron-right" aria-hidden="true"></i></button>
    <div class="lightbox-img-wrap">
      <img id="lightbox-img" src="" alt="" />
      <div class="lightbox-caption" id="lightbox-caption"></div>
    </div>
  `;
  lightbox.setAttribute('role', 'dialog');
  lightbox.setAttribute('aria-modal', 'true');
  lightbox.setAttribute('aria-label', 'Photo viewer');
  let lightboxIndex = 0;
  let lightboxTrigger = null;
  const lbImg = () => lightbox.querySelector('#lightbox-img');
  const lbCaption = () => lightbox.querySelector('#lightbox-caption');
  const lbWrap = () => lightbox.querySelector('.lightbox-img-wrap');
  function renderLightbox() {
    const p = C.gallery.photos[lightboxIndex];
    lbImg().src = p.src;
    lbImg().alt = p.alt;
    lbCaption().textContent = p.alt;
  }
  function openLightbox(i) {
    lightboxIndex = i;
    lightboxTrigger = document.activeElement;
    renderLightbox();
    lightbox.classList.add('open');
    lightbox.querySelector('.lightbox-close').focus();
  }
  function closeLightbox() {
    lightbox.classList.remove('open');
    if (lightboxTrigger) lightboxTrigger.focus();
  }
  function flipTo(dir) {
    const wrap = lbWrap();
    const flipClass = dir === 1 ? 'flip-next' : 'flip-prev';
    wrap.classList.remove('flip-next', 'flip-prev');
    wrap.classList.add(flipClass);
    lightboxIndex = (lightboxIndex + dir + C.gallery.photos.length) % C.gallery.photos.length;
    setTimeout(renderLightbox, 250);
    setTimeout(() => wrap.classList.remove(flipClass), 500);
  }
  function showNext() { flipTo(1); }
  function showPrev() { flipTo(-1); }
  lightbox.querySelector('.lightbox-close').onclick = closeLightbox;
  lightbox.querySelector('.lightbox-next').onclick = showNext;
  lightbox.querySelector('.lightbox-prev').onclick = showPrev;
  lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', e => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowRight') showNext();
    else if (e.key === 'ArrowLeft') showPrev();
    else if (e.key === 'Tab') {
      const focusables = Array.from(lightbox.querySelectorAll('button'));
      const first = focusables[0], last = focusables[focusables.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  const reactionWrap = div('section-wrap');
  reactionWrap.innerHTML = `

    <h2 class="sec-title">${C.reaction.title}</h2>
    <p class="reaction-intro reveal">${C.reaction.intro}</p>

      </div>
    </div>
  `;
  reactionSec.appendChild(reactionWrap);

  /* game logic */
  (function () {
    const panel   = reactionWrap.querySelector('#rt-panel');
    const lights  = Array.from(reactionWrap.querySelectorAll('#rt-gantry .rt-light'));
    const readout = reactionWrap.querySelector('#rt-readout');
    const rating  = reactionWrap.querySelector('#rt-rating');
    const startBtn= reactionWrap.querySelector('#rt-start');
    const ctaBtn  = reactionWrap.querySelector('#rt-cta');
    const bestEl  = reactionWrap.querySelector('#rt-best');
    const recordEl   = reactionWrap.querySelector('#rt-record');
    const recordForm = reactionWrap.querySelector('#rt-record-form');
    const recordName = reactionWrap.querySelector('#rt-record-name');
    const recordSave = reactionWrap.querySelector('#rt-record-save');

    let state = 'idle';        // idle | arming | waiting | go
    let goTime = 0;
    const timers = [];
    const clearTimers = () => { timers.forEach(clearTimeout); timers.length = 0; };

    let best = parseInt(localStorage.getItem('azkart_rt_best') || '0', 10) || null;
    const showBest = () => { bestEl.innerHTML = 'Your best: <b>' + (best ? best + ' ms' : '—') + '</b>'; };
    showBest();

    /* fastest user ("track record") — name + time saved on this device */
    let record = null;
    try { record = JSON.parse(localStorage.getItem('azkart_rt_record') || 'null'); } catch (e) { record = null; }
    let pendingMs = null;      // a new record awaiting a name
    const showRecord = () => {
      recordEl.innerHTML = record
        ? '<span class="rt-crown">🏁</span>Track record: <b>' + record.ms + ' ms</b> — <b>' + record.name + '</b>'
        : '<span class="rt-crown">🏁</span>Track record: <b>—</b> · be the first!';
    };
    const commitRecord = (name) => {
      if (pendingMs == null) return;
      record = { ms: pendingMs, name: (name || '').trim().slice(0, 16) || 'Anonymous' };
      localStorage.setItem('azkart_rt_record', JSON.stringify(record));
      pendingMs = null;
      recordForm.classList.remove('show');
      recordName.value = '';
      showRecord();
    };
    showRecord();

    const setReadout = (txt, cls) => { readout.textContent = txt; readout.className = 'rt-readout' + (cls ? ' ' + cls : ''); };
    const setLights = (n, cls) => lights.forEach((l, i) => { l.className = 'rt-light' + (i < n ? ' ' + cls : ''); });

    const rate = (ms) => {
      if (ms < 200) return '🏆 <b>F1 reflexes</b> — that\'s pro grid pace';
      if (ms < 250) return '🥇 <b>Podium pace</b> — seriously sharp';
      if (ms < 320) return '🟢 Solid racer reactions';
      if (ms < 420) return '🙂 Not bad — keep training';
      return '🐢 Plenty of room to improve';
    };

    function reset() {
      state = 'idle'; clearTimers();
      setLights(0, 'on'); panel.classList.remove('clickable');
      setReadout('Press start & wait for lights out', 'armed');
      rating.innerHTML = ''; startBtn.textContent = 'Start Lights'; startBtn.disabled = false;
    }

    function arm() {
      if (pendingMs != null) commitRecord(recordName.value);   // don't lose an unsaved record
      clearTimers(); rating.innerHTML = '';
      state = 'arming'; setLights(0, 'on');
      panel.classList.add('clickable');
      startBtn.disabled = true; startBtn.textContent = 'Get Ready…';
      setReadout('Get ready…', 'armed');
      // light up one red light per ~750ms
      for (let i = 1; i <= 5; i++) {
        timers.push(setTimeout(() => { setLights(i, 'on'); }, i * 750));
      }
      // after all five, a random hold, then LIGHTS OUT
      const hold = 900 + Math.random() * 2600;
      timers.push(setTimeout(() => {
        state = 'waiting';
        timers.push(setTimeout(() => {
          setLights(5, 'go');         // green = go
          setReadout('GO!', 'go');
          goTime = performance.now();
          state = 'go';
        }, hold));
      }, 5 * 750));
    }

    function jumpStart() {
      clearTimers(); state = 'idle';
      setLights(5, 'on');
      panel.classList.remove('clickable');
      panel.classList.add('rt-shake');
      setTimeout(() => panel.classList.remove('rt-shake'), 400);
      setReadout('Jump start! 🚦', 'foul');
      rating.innerHTML = 'Too eager — wait for the lights to go out.';
      startBtn.disabled = false; startBtn.textContent = 'Try Again';
    }

    function register() {
      const ms = Math.round(performance.now() - goTime);
      state = 'idle'; panel.classList.remove('clickable');
      setReadout(ms + '', 'go');
      readout.innerHTML = ms + '<span class="rt-unit">ms</span>';
      rating.innerHTML = rate(ms);
      if (!best || ms < best) { best = ms; localStorage.setItem('azkart_rt_best', String(ms)); rating.innerHTML += ' &nbsp;·&nbsp; <b>New best!</b>'; }
      showBest();
      // new fastest user overall? invite them to put their name on the record
      if (!record || ms < record.ms) {
        pendingMs = ms;
        rating.innerHTML += ' &nbsp;·&nbsp; <b>🏁 New track record!</b>';
        recordForm.classList.add('show');
        recordName.focus();
      }
      startBtn.disabled = false; startBtn.textContent = 'Race Again';
    }

    function tap() {
      if (state === 'arming' || state === 'waiting') { jumpStart(); }
      else if (state === 'go') { register(); }
    }

    startBtn.addEventListener('click', (e) => { e.stopPropagation(); arm(); });
    ctaBtn.addEventListener('click', () => document.getElementById(C.reaction.cta.target).scrollIntoView({ behavior: 'smooth' }));
    recordSave.addEventListener('click', (e) => { e.stopPropagation(); commitRecord(recordName.value); });
    recordName.addEventListener('click', (e) => e.stopPropagation());
    recordName.addEventListener('keydown', (e) => {
      e.stopPropagation();
      if (e.key === 'Enter') { e.preventDefault(); commitRecord(recordName.value); }
    });
    panel.addEventListener('click', (e) => { if (e.target === startBtn || e.target === ctaBtn) return; tap(); });
    // keyboard: space/enter to react when armed
    document.addEventListener('keydown', (e) => {
      if ((e.code === 'Space' || e.code === 'Enter') && (state === 'arming' || state === 'waiting' || state === 'go')) {
        if (document.activeElement === startBtn || document.activeElement === ctaBtn) return;
        e.preventDefault(); tap();
      }
    });
    reset();
  })();

  /* ---- DRIVERS ---- */
  const driversSec = section('drivers');
  const driversWrap = div('section-wrap');
  driversWrap.innerHTML = `<div class="eyebrow">${C.drivers.eyebrow}</div><h2 class="sec-title">${C.drivers.title}</h2>`;
  const dGrid = div('drivers-grid');
  C.drivers.list.forEach((d, i) => {
    const card = div('driver-card');
    card.style.transitionDelay = (i * 100) + 'ms';
    card.innerHTML = `
      <div class="driver-num">${d.number}</div>
      <div class="driver-name">${d.name}</div>
      <div class="driver-cat">${d.category}</div>
      <div class="driver-stats">
        <div><div class="ds-val">${d.wins}</div><div class="ds-lbl">Wins</div></div>
        <div><div class="ds-val">${d.points}</div><div class="ds-lbl">Points</div></div>
        <div><div class="ds-val">${d.poles}</div><div class="ds-lbl">Poles</div></div>
      </div>
    `;
    if (!prefersReducedMotion) {
      card.addEventListener('mousemove', e => {
        const r = card.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width;
        const y = (e.clientY - r.top) / r.height;
        const rotX = (0.5 - y) * 10;
        const rotY = (x - 0.5) * 10;
        card.style.transform = `translateY(0) rotateX(${rotX}deg) rotateY(${rotY}deg) scale3d(1.02,1.02,1.02)`;
      });
      card.addEventListener('mouseleave', () => { card.style.transform = ''; });
    }
    dGrid.appendChild(card);
  });
  driversWrap.appendChild(dGrid);
  driversSec.appendChild(driversWrap);

  /* ---- ORGANIZERS / TEAM ---- */
  const orgInitials = (name) => name.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  const orgSec = section('organizers');
  orgSec.appendChild(div('org-ambient'));
  const orgWrap = div('section-wrap');
  orgWrap.innerHTML = `<div class="eyebrow">${C.organizers.eyebrow}</div><h2 class="sec-title">${C.organizers.title}</h2>`;
  const orgGrid = div('org-grid');
  C.organizers.list.forEach((m, i) => {
    const card = div('org-card');
    card.style.transitionDelay = (i * 100) + 'ms';
    card.innerHTML = `
      <div class="org-cred">
        <span class="org-cred-label">AZ Karting · Crew</span>
        <span class="org-cred-checker" aria-hidden="true"></span>
      </div>
      <div class="org-avatar-wrap">
        <div class="org-avatar" aria-hidden="true">${orgInitials(m.name)}</div>
        <span class="org-avatar-icon" aria-hidden="true"><i class="ti ${m.icon || 'ti-user'}"></i></span>
      </div>
      <div class="org-name">${m.name}</div>
      <div class="org-role">${m.role}</div>
      <div class="org-foot">
        <div class="org-telemetry" aria-hidden="true">${Array.from({length:15}).map((_,b)=>`<span style="animation-delay:${(b*0.09).toFixed(2)}s"></span>`).join('')}</div>
        <div class="org-live"><span class="org-live-dot"></span><span>Telemetry · Live</span></div>
      </div>
      <span class="org-shine" aria-hidden="true"></span>
    `;
    if (!prefersReducedMotion) {
      card.addEventListener('mousemove', e => {
        const r = card.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width;
        const y = (e.clientY - r.top) / r.height;
        card.style.transform = `translateY(0) rotateX(${(0.5 - y) * 8}deg) rotateY(${(x - 0.5) * 8}deg) scale3d(1.02,1.02,1.02)`;
      });
      card.addEventListener('mouseleave', () => { card.style.transform = ''; });
    }
    orgGrid.appendChild(card);
  });
  orgWrap.appendChild(orgGrid);
  orgSec.appendChild(orgWrap);

  /* ---- CONTACT ---- */
  const contactSec = section('contact');
  const contactWrap = div('section-wrap');
  const cGrid = div('contact-grid');

  const cInfo = div('contact-info reveal-left');
  cInfo.innerHTML = `
    <div class="eyebrow">${C.contact.eyebrow}</div>
    <h2 class="sec-title">${C.contact.title}</h2>
    <p>${C.contact.intro}</p>
    <div class="contact-detail"><i class="ti ti-map-pin" aria-hidden="true"></i><div class="contact-detail-text">${C.contact.address}</div></div>
    <div class="contact-detail"><i class="ti ti-phone" aria-hidden="true"></i><div class="contact-detail-text">${C.contact.phone}</div></div>
    <div class="contact-detail"><i class="ti ti-mail" aria-hidden="true"></i><div class="contact-detail-text">${C.contact.email}</div></div>
    <div class="contact-detail"><i class="ti ti-clock" aria-hidden="true"></i><div class="contact-detail-text">${C.contact.hours}</div></div>
    <div class="contact-detail"><i class="ti ti-brand-telegram" aria-hidden="true"></i><div class="contact-detail-text"><a href="https://t.me/nmE24s" style="color:#e8c84a;text-decoration:none;">Register via Telegram: @nmE24s</a></div></div>
  `;

  const cForm = el('form', { class: 'contact-form reveal-right' });
  cForm.innerHTML = `
    <div class="form-row">
      <input type="text" placeholder="First name" />
      <input type="text" placeholder="Last name" />
    </div>
    <input type="email" placeholder="Email address" />
    <input type="tel" placeholder="Phone number" />
    <select>
      <option value="" disabled selected>I'm interested in...</option>
      ${C.contact.inquiryOptions.map(o => `<option>${o}</option>`).join('')}
    </select>
    <textarea placeholder="Your message"></textarea>
    <button type="submit" class="btn-primary" style="width:100%; padding:14px;"><i class="ti ti-brand-telegram" style="margin-right:6px;"></i>Register via Telegram</button>
    <div class="form-success" id="form-success"><i class="ti ti-check" aria-hidden="true"></i> Redirecting you to Telegram — @nmE24s</div>
  `;
  cForm.onsubmit = e => {
    e.preventDefault();
    const msg = document.getElementById('form-success');
    msg.style.display = 'block';
    setTimeout(() => { window.open('https://t.me/nmE24s', '_blank'); msg.style.display = 'none'; }, 1000);
  };

  cGrid.append(cInfo, cForm);
  contactWrap.appendChild(cGrid);
  contactSec.appendChild(contactWrap);

  /* ---- FOOTER ---- */
  const footerEl = el('footer');
  const fInner = div('footer-inner');
  fInner.innerHTML = `
    <div class="footer-logo">${C.footer.logo}</div>
    <div class="footer-copy">${C.footer.copyright}</div>
    <div class="footer-links">
      ${C.footer.links.map(l => `<a href="${l.href}">${l.label}</a>`).join('')}
    </div>
  `;
  footerEl.appendChild(fInner);

  /* ---- DIVIDER helper ---- */
  const hr = () => el('div', { class: 'divider' });

  /* ---- ASSEMBLE PAGE ---- */
  const root = document.getElementById('root');
  root.append(navEl, heroSec, statsBar, hr(), aboutSec, hr(), schedSec, hr(), galSec, hr(), reactionSec, hr(), driversSec, hr(), orgSec, hr(), contactSec, footerEl);
  document.body.appendChild(lightbox);

  /* ---- GALLERY SCROLL ANIMATIONS ---- */
  const photoCells = Array.from(photoGrid.querySelectorAll('.photo-cell'));
  const cellObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const i = Number(entry.target.dataset.index);
        entry.target.style.transitionDelay = (i * 80) + 'ms';
        entry.target.classList.add('in-view');
        cellObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15 });
  photoCells.forEach(c => cellObserver.observe(c));

  /* ---- GENERIC SCROLL REVEAL (about, schedule, drivers, contact, stats) ---- */
  const revealTargets = document.querySelectorAll('.reveal, .reveal-left, .reveal-right, .stat, .schedule-item, .driver-card, .org-card');
  const revealObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('in-view');
        revealObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15 });
  revealTargets.forEach(t => revealObserver.observe(t));

  /* ---- SECTION TITLE WIPE-IN ---- */
  const titleEls = document.querySelectorAll('.sec-title');
  if (prefersReducedMotion) {
    titleEls.forEach(t => t.classList.add('title-in'));
  } else {
    const titleObserver = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('title-in');
          titleObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.4 });
    titleEls.forEach(t => titleObserver.observe(t));
  }

  /* ---- STATS COUNT-UP ---- */
  const statEls = Array.from(statsBar.querySelectorAll('.stat'));
  let statsAnimated = false;
  const statsObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting && !statsAnimated) {
        statsAnimated = true;
        statEls.forEach((stat, i) => {
          const numEl = stat.querySelector('.stat-num');
          const raw = C.stats[i].value;
          const match = raw.match(/^(\d+)(.*)$/);
          if (!match || prefersReducedMotion) return;
          const target = Number(match[1]);
          const suffix = match[2];
          const duration = 1200;
          const start = performance.now();
          function step(now) {
            const progress = Math.min((now - start) / duration, 1);
            const eased = 1 - Math.pow(1 - progress, 3);
            numEl.textContent = Math.round(target * eased) + suffix;
            if (progress < 1) requestAnimationFrame(step);
          }
          requestAnimationFrame(step);
        });
        statsObserver.disconnect();
      }
    });
  }, { threshold: 0.4 });
  statsObserver.observe(statsBar);

  let kartZoomPlayed = false;
  const kartObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting && !kartZoomPlayed) {
        kartZoomPlayed = true;
        kartZoom.classList.add('run');
        kartObserver.disconnect();
      }
    });
  }, { threshold: 0.3 });
  kartObserver.observe(galSec);

  /* ---- WEBGL SHADER ---- */
  const canvas = document.getElementById('heroCanvas');
  const gl = canvas.getContext('webgl');
  if (gl) {
    const vs = `attribute vec2 a_pos; void main(){ gl_Position=vec4(a_pos,0.,1.); }`;
    const fs = `
      precision highp float;
      uniform vec2 u_res; uniform float u_time;
      void main(){
        vec2 uv=(gl_FragCoord.xy*2.-u_res.xy)/min(u_res.x,u_res.y);
        float t=u_time*0.05; float lw=0.002;
        vec3 color=vec3(0.);
        for(int j=0;j<3;j++)
          for(int i=0;i<5;i++)
            color[j]+=lw*float(i*i)/abs(fract(t-.01*float(j)+float(i)*.01)*5.-length(uv)+mod(uv.x+uv.y,.2));
        gl_FragColor=vec4(color,1.);
      }`;
    const comp = (src, type) => { const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s); return s; };
    const prog = gl.createProgram();
    gl.attachShader(prog, comp(vs, gl.VERTEX_SHADER));
    gl.attachShader(prog, comp(fs, gl.FRAGMENT_SHADER));
    gl.linkProgram(prog); gl.useProgram(prog);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
    const ap = gl.getAttribLocation(prog,'a_pos');
    gl.enableVertexAttribArray(ap); gl.vertexAttribPointer(ap,2,gl.FLOAT,false,0,0);
    const uRes = gl.getUniformLocation(prog,'u_res');
    const uTime = gl.getUniformLocation(prog,'u_time');
    let t = 0;
    const resize = () => {
      const h = canvas.parentElement;
      canvas.width = h.clientWidth; canvas.height = h.clientHeight;
      gl.viewport(0,0,canvas.width,canvas.height);
    };
    const draw = () => {
      resize();
      gl.uniform2f(uRes, canvas.width, canvas.height);
      gl.uniform1f(uTime, t);
      gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
      t += 0.05;
      requestAnimationFrame(draw);
    };
    resize();
    window.addEventListener('resize', resize);
    draw();
  }

})();
</script>

<script>
(function() {
  var track = document.getElementById('kart-track');
  var kartSvg = document.getElementById('kart-svg');
  var streak = document.getElementById('kart-streak');
  var lastScroll = window.scrollY;
  var kartX = -140;
  var speed = 0;        // signed speed (px / frame): + drives right, - drives left
  var dir = 1;          // last travel direction (1 = right, -1 = left) for facing
  var renderDir = 1;    // smoothed facing direction for the 3D turn
  var lean = 0;         // smoothed body lean
  var bob = 0;          // bobbing phase
  var puff1 = document.getElementById('puff1');
  var puff2 = document.getElementById('puff2');
  var puffT = 0;
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // The kart sits on track and only drives while you're scrolling.
  if (!reduceMotion) {
    track.classList.add('visible');
    requestAnimationFrame(animate);
  }

  // Scrolling feeds speed to the kart; when you stop, it coasts to a halt.
  window.addEventListener('scroll', function() {
    var sy = window.scrollY;
    var delta = sy - lastScroll;
    lastScroll = sy;
    speed += delta * 0.12;                           // scroll down -> right, scroll up -> left
    speed = Math.max(-6, Math.min(6, speed));        // clamp top speed both ways
  }, { passive: true });

  function animate() {
    speed *= 0.90;                                  // coast down when not scrolling
    if (Math.abs(speed) < 0.04) speed = 0;          // fully stop once it's crawling
    var velocity = speed;                           // signed: moves only while scrolling
    kartX += velocity;

    // wrap around either edge so it keeps lapping in whichever direction it's headed
    if (kartX > window.innerWidth + 90) kartX = -150;
    else if (kartX < -150) kartX = window.innerWidth + 90;

    // face the way it's travelling (keep last facing while stopped)
    if (velocity > 0.05) dir = 1;
    else if (velocity < -0.05) dir = -1;
    renderDir += (dir - renderDir) * 0.14;
    var faceY = (1 - (renderDir + 1) / 2) * 180;    // dir=1 -> 0deg, dir=-1 -> 180deg

    // lean back under acceleration, plus a little bob/tilt for life
    var targetLean = Math.max(-14, Math.min(14, velocity * 1.6));
    lean += (targetLean - lean) * 0.14;
    bob += 0.32;
    var bobY = Math.sin(bob) * 1.6;
    var tilt = Math.sin(bob * 0.6) * 2.2;

    kartSvg.style.left = Math.round(kartX) + 'px';
    kartSvg.style.transform =
      'translateY(' + bobY.toFixed(2) + 'px) ' +
      'rotateY(' + faceY.toFixed(1) + 'deg) ' +
      'rotateZ(' + (lean * -0.45).toFixed(2) + 'deg) ' +
      'rotateX(' + tilt.toFixed(2) + 'deg)';

    // speed streak trails behind the kart, on the side opposite travel (none when stopped)
    var trail = Math.min(100, Math.abs(velocity) * 12);
    if (renderDir >= 0) {
      streak.style.left = Math.round(kartX - trail) + 'px';
      streak.style.transform = 'none';
    } else {
      streak.style.left = Math.round(kartX + 120) + 'px';
      streak.style.transform = 'scaleX(-1)';
    }
    streak.style.transformOrigin = 'left center';
    streak.style.width = Math.round(trail) + 'px';

    puffT++;
    if (puffT % 6 === 0 && Math.abs(speed) > 0.3) {
      var op1 = 0.15 + Math.random() * 0.2;
      var r1 = 3 + Math.random() * 3;
      var r2 = 2 + Math.random() * 2;
      puff1.style.width = puff1.style.height = (r1 * 2) + 'px';
      puff1.style.left = (8 - r1) + 'px';
      puff1.style.top = (30 - r1) + 'px';
      puff1.style.background = 'rgba(200,200,200,' + op1 + ')';
      puff2.style.width = puff2.style.height = (r2 * 2) + 'px';
      puff2.style.left = (4 - r2) + 'px';
      puff2.style.top = (24 - r2) + 'px';
      puff2.style.background = 'rgba(200,200,200,' + (op1 * 0.6) + ')';
    }

    requestAnimationFrame(animate);
  }
})();
</script>
